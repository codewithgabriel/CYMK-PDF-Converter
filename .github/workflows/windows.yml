name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-version.mjs
      - run: npm ci
      - name: Bundle verified Ghostscript runtime
        shell: pwsh
        run: ./scripts/bundle-ghostscript.ps1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Test PDF engine with bundled Windows runtime
        shell: pwsh
        run: |
          $env:INKWELL_GS = (Resolve-Path 'src-tauri/resources/ghostscript/bin/gswin64c.exe').Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test conversion -- --ignored
      - name: Test document studio interface
        run: |
          npx playwright install chromium
          npm run test:ui
      - run: npm run tauri build
      - name: Install and launch packaged app
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release/
          Copy-Item src-tauri/resources/ghostscript/UPSTREAM.json release/Ghostscript-UPSTREAM.json
      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-Windows-x64-installer
          path: release/*
          if-no-files-found: error
  publish:
    if: github.event.repository.private == false && startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Inkwell-Windows-x64-installer
          path: installer
      - name: Publish tested Windows update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          setup="Inkwell_${version}_x64-setup.exe"
          test -s "installer/$setup"
          test -s installer/Ghostscript-UPSTREAM.json
          test -s "release-notes/$RELEASE_TAG.md"
          (cd installer && sha256sum "$setup" Ghostscript-UPSTREAM.json > SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Inkwell $version for Windows" --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" "installer/$setup" installer/SHA256SUMS.txt installer/Ghostscript-UPSTREAM.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "release-notes/$RELEASE_TAG.md"
