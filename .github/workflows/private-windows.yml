name: Private Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    # Key-bearing binaries must never be uploaded to the public repository.
    if: github.event.repository.private == true
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/check-version.mjs
      - run: npm ci
      - name: Bundle verified Ghostscript runtime
        shell: pwsh
        run: ./scripts/bundle-ghostscript.ps1
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Verify private key configuration with a dummy key
        env:
          INKWELL_PRIVATE_API_KEY: inkwell-ci-placeholder-never-a-real-api-key
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features private-key --test private_key
      - name: Test PDF engine with bundled Windows runtime
        shell: pwsh
        run: |
          $env:INKWELL_GS = (Resolve-Path 'src-tauri/resources/ghostscript/bin/gswin64c.exe').Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test conversion -- --ignored
      - name: Test document studio interface
        run: |
          npx playwright install chromium
          npm run test:ui
      - name: Build private installer
        env:
          INKWELL_PRIVATE_API_KEY: ${{ secrets.INKWELL_PRIVATE_API_KEY }}
        shell: pwsh
        run: |
          if (!$env:INKWELL_PRIVATE_API_KEY) { throw 'Private build secret has not been configured.' }
          npm run tauri build -- --features private-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-private-binary.mjs
      - name: Install and launch packaged app
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Publish installer to this private repository only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $private = gh repo view --json isPrivate --jq .isPrivate
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') { throw 'Refusing to publish a key-bearing installer to a public repository.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = "src-tauri/target/release/bundle/nsis/Inkwell_${version}_x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Inkwell_${version}_x64-setup.exe" | Set-Content SHA256SUMS.txt
          gh release create "v$version" $setup SHA256SUMS.txt src-tauri/resources/ghostscript/UPSTREAM.json --target $env:GITHUB_SHA --title "Inkwell $version — private edition" --notes-file release-notes/private.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
