[package]
name = "inkwell"
default-run = "inkwell"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
lopdf = "0.36"
base64 = "0.22"
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "inkwell"
required-features = ["desktop"]

[[bin]]
name = "inkwell-convert"
path = "src/cli.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep local desktop builds practical on machines with limited disk space.
[profile.dev]
debug = 0
incremental = false
